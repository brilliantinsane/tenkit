name: Draft Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Final release channel
        required: true
        type: choice
        options:
          - stable
          - rc
        default: stable

concurrency:
  group: release-set-draft
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build Release Set
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      source-sha: ${{ steps.plan.outputs.source-sha }}
      version: ${{ steps.plan.outputs.version }}
      npm-dist-tag: ${{ steps.plan.outputs.npm-dist-tag }}
      git-tag: ${{ steps.plan.outputs.git-tag }}
      github-release-type: ${{ steps.plan.outputs.github-release-type }}
      package-order: ${{ steps.plan.outputs.package-order }}
      template-shasum: ${{ steps.pack.outputs.template-shasum }}
      cli-shasum: ${{ steps.pack.outputs.cli-shasum }}
      create-shasum: ${{ steps.pack.outputs.create-shasum }}
      template-integrity: ${{ steps.pack.outputs.template-integrity }}
      cli-integrity: ${{ steps.pack.outputs.cli-integrity }}
      create-integrity: ${{ steps.pack.outputs.create-integrity }}
    steps:
      - name: Enforce default-branch dispatch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          if [ "$DISPATCH_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Draft Release must be dispatched from $DEFAULT_BRANCH."
            exit 1
          fi

      - name: Checkout captured source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Record exact source SHA
        id: source
        env:
          DISPATCH_SOURCE_SHA: ${{ github.sha }}
        run: |
          SOURCE_SHA=$(git rev-parse HEAD)
          if ! printf '%s' "$DISPATCH_SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::GitHub supplied an invalid dispatch source SHA."
            exit 1
          fi
          if [ "$SOURCE_SHA" != "$DISPATCH_SOURCE_SHA" ]; then
            echo "::error::Checked-out source $SOURCE_SHA does not match dispatch source $DISPATCH_SOURCE_SHA."
            exit 1
          fi
          echo "Recorded Release Set source: $SOURCE_SHA"
          echo "source-sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install pinned npm and pnpm
        run: |
          NPM_VERSION=$(tr -d '[:space:]' < .npm-version)
          PNPM_VERSION=$(node -p "require('./package.json').packageManager.split('@')[1]")
          npm install --global "npm@$NPM_VERSION"
          corepack enable
          corepack prepare "pnpm@$PNPM_VERSION" --activate
          test "$(npm --version)" = "$NPM_VERSION"
          test "$(pnpm --version)" = "$PNPM_VERSION"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Plan Release Set
        id: plan
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
          SOURCE_SHA: ${{ steps.source.outputs.source-sha }}
        run: |
          PLAN_JSON=$(pnpm --silent release:plan -- --channel "$RELEASE_CHANNEL" --source "$SOURCE_SHA")
          test "$(printf '%s' "$PLAN_JSON" | jq -r '.kind')" = 'release'
          PLANNED_CHANNEL=$(printf '%s' "$PLAN_JSON" | jq -r '.channel')
          PLANNED_SOURCE_SHA=$(printf '%s' "$PLAN_JSON" | jq -r '.sourceSha')
          VERSION=$(printf '%s' "$PLAN_JSON" | jq -r '.version')
          NPM_DIST_TAG=$(printf '%s' "$PLAN_JSON" | jq -r '.npmDistTag')
          GIT_TAG=$(printf '%s' "$PLAN_JSON" | jq -r '.gitTag')
          GITHUB_RELEASE_TYPE=$(printf '%s' "$PLAN_JSON" | jq -r '.githubReleaseType')
          PACKAGE_ORDER=$(printf '%s' "$PLAN_JSON" | jq -c '.dependencyApprovalOrder')
          test "$PLANNED_CHANNEL" = "$RELEASE_CHANNEL"
          test "$PLANNED_SOURCE_SHA" = "$SOURCE_SHA"
          printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?$'
          printf '%s' "$NPM_DIST_TAG" | grep -Eq '^(latest|next)$'
          printf '%s' "$GIT_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?$'
          printf '%s' "$GITHUB_RELEASE_TYPE" | grep -Eq '^(release|prerelease)$'
          test "$PACKAGE_ORDER" = '["@tenkit/template-generator","@tenkit/cli","create-tenkit"]'
          {
            echo "channel=$PLANNED_CHANNEL"
            echo "source-sha=$PLANNED_SOURCE_SHA"
            echo "version=$VERSION"
            echo "npm-dist-tag=$NPM_DIST_TAG"
            echo "git-tag=$GIT_TAG"
            echo "github-release-type=$GITHUB_RELEASE_TYPE"
            echo "package-order=$PACKAGE_ORDER"
          } >> "$GITHUB_OUTPUT"

      - name: Run comprehensive source checks
        run: pnpm release:check

      - name: Pack canonical Release Set
        id: pack
        env:
          WORKSPACE_ROOT: ${{ github.workspace }}
          SOURCE_SHA: ${{ steps.plan.outputs.source-sha }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          BUILD_JSON=$(pnpm --silent -F @tenkit/release-tools draft:build)
          printf '%s' "$BUILD_JSON" | jq -e \
            --arg sourceSha "$SOURCE_SHA" \
            --arg version "$VERSION" \
            '.sourceSha == $sourceSha and .version == $version and (.packages | length == 3)' >/dev/null

          diagnostic() {
            printf '%s' "$BUILD_JSON" | jq -r --arg package "$1" --arg field "$2" \
              '.packages[] | select(.name == $package) | .[$field]'
          }

          TEMPLATE_SHASUM=$(diagnostic '@tenkit/template-generator' shasum)
          CLI_SHASUM=$(diagnostic '@tenkit/cli' shasum)
          CREATE_SHASUM=$(diagnostic 'create-tenkit' shasum)
          TEMPLATE_INTEGRITY=$(diagnostic '@tenkit/template-generator' integrity)
          CLI_INTEGRITY=$(diagnostic '@tenkit/cli' integrity)
          CREATE_INTEGRITY=$(diagnostic 'create-tenkit' integrity)

          for shasum in "$TEMPLATE_SHASUM" "$CLI_SHASUM" "$CREATE_SHASUM"; do
            printf '%s' "$shasum" | grep -Eq '^[0-9a-f]{40}$'
          done
          for integrity in "$TEMPLATE_INTEGRITY" "$CLI_INTEGRITY" "$CREATE_INTEGRITY"; do
            printf '%s' "$integrity" | grep -Eq '^sha512-[A-Za-z0-9+/]+={0,2}$'
          done

          {
            echo "template-shasum=$TEMPLATE_SHASUM"
            echo "cli-shasum=$CLI_SHASUM"
            echo "create-shasum=$CREATE_SHASUM"
            echo "template-integrity=$TEMPLATE_INTEGRITY"
            echo "cli-integrity=$CLI_INTEGRITY"
            echo "create-integrity=$CREATE_INTEGRITY"
          } >> "$GITHUB_OUTPUT"

      - name: Upload exact Release Set tarballs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: draft-release-set-${{ steps.plan.outputs.source-sha }}
          path: release-artifacts/*.tgz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  stage:
    name: Stage Release Set on npm
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_CHANNEL: ${{ needs.build.outputs.channel }}
      SOURCE_SHA: ${{ needs.build.outputs.source-sha }}
      VERSION: ${{ needs.build.outputs.version }}
      NPM_DIST_TAG: ${{ needs.build.outputs.npm-dist-tag }}
      GIT_TAG: ${{ needs.build.outputs.git-tag }}
      GITHUB_RELEASE_TYPE: ${{ needs.build.outputs.github-release-type }}
      PACKAGE_ORDER: ${{ needs.build.outputs.package-order }}
    outputs:
      template-stage-id: ${{ steps.stage-release-set.outputs.template-stage-id }}
      cli-stage-id: ${{ steps.stage-release-set.outputs.cli-stage-id }}
      create-stage-id: ${{ steps.stage-release-set.outputs.create-stage-id }}
    steps:
      - name: Checkout reviewed source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ needs.build.outputs.source-sha }}

      - name: Setup Node without a dependency cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install pinned staging npm
        run: |
          NPM_VERSION=$(tr -d '[:space:]' < .npm-version)
          npm install --global "npm@$NPM_VERSION"
          test "$(npm --version)" = "$NPM_VERSION"

      - name: Download exact Release Set tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: draft-release-set-${{ needs.build.outputs.source-sha }}
          path: release-artifacts

      - name: Start private staging diagnostics
        run: |
          {
            echo '## Private staging diagnostics'
            echo ''
            echo 'These stage references are untrusted diagnostics. Verify directly through authenticated npm before approval or rejection.'
            echo ''
            echo "- Channel: \`$RELEASE_CHANNEL\`"
            echo "- Source SHA: \`$SOURCE_SHA\`"
            echo "- Version: \`$VERSION\`"
            echo "- npm dist-tag: \`$NPM_DIST_TAG\`"
            echo "- Git tag: \`$GIT_TAG\`"
            echo "- GitHub Release type: \`$GITHUB_RELEASE_TYPE\`"
            echo "- Package approval order: \`$PACKAGE_ORDER\`"
            echo ''
            echo '| Package | Stage reference | Tag |'
            echo '|---|---|---|'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage Release Set in dependency order
        id: stage-release-set
        env:
          TEMPLATE_ARTIFACT: ./release-artifacts/tenkit-template-generator-${{ needs.build.outputs.version }}.tgz
          CLI_ARTIFACT: ./release-artifacts/tenkit-cli-${{ needs.build.outputs.version }}.tgz
          CREATE_ARTIFACT: ./release-artifacts/create-tenkit-${{ needs.build.outputs.version }}.tgz
          TEMPLATE_SHASUM: ${{ needs.build.outputs.template-shasum }}
          CLI_SHASUM: ${{ needs.build.outputs.cli-shasum }}
          CREATE_SHASUM: ${{ needs.build.outputs.create-shasum }}
        run: |
          stage_package() {
            PACKAGE_NAME=$1
            ARTIFACT=$2
            EXPECTED_SHASUM=$3
            OUTPUT_NAME=$4
            ACTUAL_SHASUM=$(sha1sum "$ARTIFACT" | cut -d ' ' -f1)
            test "$ACTUAL_SHASUM" = "$EXPECTED_SHASUM"

            set +e
            OUTPUT=$(npm stage publish "$ARTIFACT" --tag "$NPM_DIST_TAG" --access public --provenance --json 2>&1)
            STAGE_EXIT=$?
            set -e

            STAGE=$(printf '%s' "$OUTPUT" | sed -n '/^{/,$p' | jq -c '[.. | objects | select(.stageId)][0] // empty' 2>/dev/null || true)
            STAGE_ID=$(printf '%s' "$STAGE" | jq -r '.stageId // empty')
            STAGED_SHASUM=$(printf '%s' "$STAGE" | jq -r '.shasum // empty')
            if printf '%s' "$STAGE_ID" | grep -Eq '^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$'; then
              echo "$PACKAGE_NAME $STAGE_ID" >> "$RUNNER_TEMP/tenkit-stage-references"
              echo "| $PACKAGE_NAME | \`$STAGE_ID\` | \`$NPM_DIST_TAG\` |" >> "$GITHUB_STEP_SUMMARY"
              echo "npm returned stage reference $STAGE_ID for $PACKAGE_NAME."
            fi

            if [ "$STAGE_EXIT" -ne 0 ]; then
              echo "::error::npm failed while staging $PACKAGE_NAME. Raw registry output is suppressed. Discover registry state directly before rejection."
              return "$STAGE_EXIT"
            fi

            printf '%s' "$STAGE_ID" | grep -Eq '^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$'
            test "$STAGED_SHASUM" = "$EXPECTED_SHASUM"
            echo "$OUTPUT_NAME=$STAGE_ID" >> "$GITHUB_OUTPUT"
          }

          while IFS= read -r package_name; do
            case "$package_name" in
              '@tenkit/template-generator')
                stage_package "$package_name" "$TEMPLATE_ARTIFACT" "$TEMPLATE_SHASUM" template-stage-id
                ;;
              '@tenkit/cli')
                stage_package "$package_name" "$CLI_ARTIFACT" "$CLI_SHASUM" cli-stage-id
                ;;
              'create-tenkit')
                stage_package "$package_name" "$CREATE_ARTIFACT" "$CREATE_SHASUM" create-stage-id
                ;;
              *)
                echo "::error::Release Plan contains unknown package $package_name."
                exit 1
                ;;
            esac
          done < <(printf '%s' "$PACKAGE_ORDER" | jq -r '.[]')

      - name: Record staging recovery instructions
        if: ${{ always() }}
        run: |
          {
            echo ''
            echo '### Staging recovery'
            echo ''
            echo "- Source SHA: \`$SOURCE_SHA\`"
            echo "- Version: \`$VERSION\`"
            if [ -s "$RUNNER_TEMP/tenkit-stage-references" ]; then
              echo '- Stage references recovered before failure:'
              while read -r package_name stage_id; do
                echo "  - $package_name: \`$stage_id\`"
              done < "$RUNNER_TEMP/tenkit-stage-references"
            else
              echo '- No stage reference was recovered from npm output.'
            fi
            echo ''
            echo 'If staging failed, classify the same-version registry state before changing or retrying anything:'
            echo '```bash'
            echo "npm view @tenkit/template-generator@$VERSION version"
            echo "npm view @tenkit/cli@$VERSION version"
            echo "npm view create-tenkit@$VERSION version"
            echo 'npm stage list @tenkit/template-generator'
            echo 'npm stage list @tenkit/cli'
            echo 'npm stage list create-tenkit'
            echo '```'
            echo ''
            echo 'Find stage IDs in npm Staged Packages, authenticated npm stage list output, or a Release Verification report. Never copy them from an agent conversation. Prefer npm Staged Packages for manual rejection.'
            echo ''
            if [ "$RELEASE_CHANNEL" = 'stable' ]; then
              echo '1. If any same-version package is public, stop. Do not retry Draft or attempt to reject a public version. Record the complete public and private registry state for repository-owner review, then follow the Stable partial-public fix-forward procedure in the operator runbook. The reviewed fix commit must include `Release-Fix-Forward: <public-version>` so tokenless Draft planning selects the next patch version.'
            else
              echo '1. If any same-version RC package is public, stop. Do not retry Draft, reject a public version, add Release-Fix-Forward, or choose another RC ordinal. Record the complete public and private registry state for repository-owner review; current Git-only RC planning authorizes no automatic recovery.'
            fi
            echo '2. If this run created no private stage and all three existing private stages belong to one complete, valid earlier Release Set, continue that earlier attempt.'
            echo '3. Otherwise, reject all same-version private stages across the current and earlier attempts with maintainer 2FA before starting a fresh Draft. Do not combine stages from different attempts.'
          } >> "$GITHUB_STEP_SUMMARY"

  create-draft-release:
    name: Create draft GitHub Release
    needs: [build, stage]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_CHANNEL: ${{ needs.build.outputs.channel }}
      SOURCE_SHA: ${{ needs.build.outputs.source-sha }}
      VERSION: ${{ needs.build.outputs.version }}
      NPM_DIST_TAG: ${{ needs.build.outputs.npm-dist-tag }}
      GIT_TAG: ${{ needs.build.outputs.git-tag }}
      GITHUB_RELEASE_TYPE: ${{ needs.build.outputs.github-release-type }}
      PACKAGE_ORDER: ${{ needs.build.outputs.package-order }}
    steps:
      - name: Materialize untrusted Draft diagnostics
        env:
          TEMPLATE_STAGE_ID: ${{ needs.stage.outputs.template-stage-id }}
          CLI_STAGE_ID: ${{ needs.stage.outputs.cli-stage-id }}
          CREATE_STAGE_ID: ${{ needs.stage.outputs.create-stage-id }}
          TEMPLATE_INTEGRITY: ${{ needs.build.outputs.template-integrity }}
          CLI_INTEGRITY: ${{ needs.build.outputs.cli-integrity }}
          CREATE_INTEGRITY: ${{ needs.build.outputs.create-integrity }}
          TEMPLATE_SHASUM: ${{ needs.build.outputs.template-shasum }}
          CLI_SHASUM: ${{ needs.build.outputs.cli-shasum }}
          CREATE_SHASUM: ${{ needs.build.outputs.create-shasum }}
        run: |
          APPROVAL_ORDER=$(printf '%s' "$PACKAGE_ORDER" | jq -r 'join(" -> ")')
          {
            echo "# Tenkit $GIT_TAG"
            echo ''
            echo '## Untrusted Draft diagnostics'
            echo ''
            echo 'Everything below is a convenience hint from GitHub Actions. Independently obtain verification evidence from npm before approving any stage.'
            echo ''
            echo "- Channel: \`$RELEASE_CHANNEL\`"
            echo "- Version: \`$VERSION\`"
            echo "- npm dist-tag: \`$NPM_DIST_TAG\`"
            echo "- Git tag: \`$GIT_TAG\`"
            echo "- GitHub Release type: \`$GITHUB_RELEASE_TYPE\`"
            echo "- Source SHA: \`$SOURCE_SHA\`"
            echo "- Release Set identity: \`$SOURCE_SHA + $VERSION\`"
            echo "- Package approval order: \`$APPROVAL_ORDER\`"
            echo "- Observed state: \`fully private\`"
            echo ''
            echo '| Package | Stage reference | Integrity | Shasum |'
            echo '|---|---|---|---|'
            echo "| @tenkit/template-generator | \`$TEMPLATE_STAGE_ID\` | \`$TEMPLATE_INTEGRITY\` | \`$TEMPLATE_SHASUM\` |"
            echo "| @tenkit/cli | \`$CLI_STAGE_ID\` | \`$CLI_INTEGRITY\` | \`$CLI_SHASUM\` |"
            echo "| create-tenkit | \`$CREATE_STAGE_ID\` | \`$CREATE_INTEGRITY\` | \`$CREATE_SHASUM\` |"
            echo ''
            echo '## Release Verification'
            echo ''
            echo '```bash'
            echo "pnpm release:verify -- --source-sha $SOURCE_SHA --version $VERSION"
            echo '```'
            echo ''
            echo 'Next action: Run the Release Verification command above. Approve nothing until it passes and names one package.'
            echo ''
            if [ "$RELEASE_CHANNEL" = 'stable' ]; then
              echo '## Website visibility gate'
              echo ''
              echo 'After Release Publication, run this outside the Tenkit workspace before dependent website work:'
              echo '```bash'
              echo 'pnpm create tenkit@latest --version'
              echo '```'
              echo ''
            fi
            echo 'This Release is a draft. No public npm version or Git tag was created.'
            echo ''
            echo '> External alias cleanup and the first natural RC remain manual, separately authenticated operations.'
          } > "$RUNNER_TEMP/release-notes.md"

      - name: Create draft GitHub Release
        id: create-release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_RELEASE_TYPE" in
            release) set -- ;;
            prerelease) set -- --prerelease ;;
            *)
              echo "::error::Unsupported GitHub Release type $GITHUB_RELEASE_TYPE."
              exit 1
              ;;
          esac

          DRAFT_URL=$(gh release create "$GIT_TAG" \
            "$@" \
            --draft \
            --title "$GIT_TAG" \
            --target "$SOURCE_SHA" \
            --notes-file "$RUNNER_TEMP/release-notes.md")
          echo "draft-url=$DRAFT_URL" >> "$GITHUB_OUTPUT"

      - name: Summarize untrusted Draft diagnostics
        env:
          DRAFT_URL: ${{ steps.create-release.outputs.draft-url }}
        run: |
          cat "$RUNNER_TEMP/release-notes.md" >> "$GITHUB_STEP_SUMMARY"
          {
            echo ''
            echo "Inspect the [draft GitHub Release]($DRAFT_URL)."
          } >> "$GITHUB_STEP_SUMMARY"
